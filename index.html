<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.json" />
  <title>平板 POS</title>
  <style>
    :root {
      --bg: #f2f4f7;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #f97316;
      --line: #e5e7eb;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    button {
      min-height: 50px;
      user-select: none;
      -webkit-user-select: none;
    }

    button::-moz-focus-inner {
      border: 0;
      padding: 0;
    }

    html,
    body {
      height: 100% !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      background-color: #0f172a;
      background-image:
        linear-gradient(rgba(15, 23, 42, 0.42), rgba(15, 23, 42, 0.42)),
        url("https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1920&q=80");
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #posWorkspace {
      flex: 1;
      width: 100%;
      height: 100vh !important;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .app {
      padding: 12px;
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      height: 100% !important;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
      padding-bottom: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: transparent;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      color: #1e3a8a;
      letter-spacing: 1px;
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cloud-pending-bar {
      flex-shrink: 0;
      background: linear-gradient(135deg, #7f1d1d 0%, #ea580c 100%);
      color: #fffbeb;
      border-radius: 14px;
      padding: 12px 14px;
      border: 2px solid #fdba74;
      max-height: 38vh;
      overflow: auto;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .cloud-pending-bar[hidden] {
      display: none !important;
    }

    .cloud-pending-title {
      font-size: 20px;
      font-weight: 900;
      margin: 0 0 10px;
      letter-spacing: 0.04em;
    }

    .cloud-pending-card {
      background: rgba(15, 23, 42, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 251, 235, 0.35);
    }

    .cloud-pending-card:last-child {
      margin-bottom: 0;
    }

    .cloud-pending-meta {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      margin-bottom: 6px;
    }

    .cloud-pending-items {
      font-size: 15px;
      line-height: 1.5;
      opacity: 0.95;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .cloud-accept-btn {
      min-height: 46px;
      padding: 0 16px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      border-radius: 10px;
      background: #fef08a;
      color: #78350f;
      cursor: pointer;
    }

    .cloud-accept-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .store-control-strip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 14px;
      border: 2px solid #1e3a8a;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
    }

    .store-accept-switch {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      user-select: none;
      font-size: 20px;
      font-weight: 900;
      color: #0f172a;
    }

    .store-accept-switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .store-accept-track {
      width: 64px;
      height: 34px;
      border-radius: 999px;
      background: #cbd5e1;
      position: relative;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .store-accept-track::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fff;
      top: 3px;
      left: 3px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .store-accept-switch input:checked + .store-accept-track {
      background: #22c55e;
    }

    .store-accept-switch input:checked + .store-accept-track::after {
      transform: translateX(30px);
    }

    .store-accept-switch input:focus-visible + .store-accept-track {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }

    .report-btn {
      border: none;
      background: #111827;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      padding: 14px 18px;
      min-height: 54px;
      cursor: pointer;
    }

    .tool-btn {
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.72);
      color: #1f2937;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      padding: 8px 10px;
      min-height: 44px;
      cursor: pointer;
    }

    .floating-admin-actions {
      position: fixed;
      left: 18px;
      bottom: 10px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      max-width: calc(100vw - 32px);
      background: transparent;
    }

    .inventory-btn,
    .monthly-ranking-btn {
      appearance: none;
      -webkit-appearance: none;
      border: 0 !important;
      outline: none;
      box-shadow: none;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      border-radius: 999px;
      padding: 12px 16px;
      min-height: 50px;
      cursor: pointer;
      background-clip: padding-box;
    }

    .inventory-btn {
      background: #0f766e !important;
    }

    .monthly-ranking-btn {
      background: #2563eb !important;
    }

    .layout {
      flex: 1;
      height: 100%;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 350px;
      gap: 16px;
      overflow: hidden;
    }

    .layout > .panel:first-child {
      min-width: 0;
      min-height: 0;
      height: 100%;
      max-height: 100%;
    }

    .layout > .panel:last-child {
      width: 350px;
      max-width: 350px;
      min-width: 350px;
      height: 100%;
      justify-self: end;
    }

    .app-logout-footer {
      position: fixed;
      left: 50%;
      bottom: 10px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      transform: translateX(-50%);
    }

    .btn-logout {
      border: 1px solid rgba(220, 38, 38, 0.42);
      background: rgba(255, 255, 255, 0.9);
      color: #b91c1c;
      font-size: 15px;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 28px;
      min-height: 48px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .btn-logout:active {
      transform: scale(0.99);
    }

    .checkout-panel {
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 15px;
      padding: 12px 20px 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(226, 232, 240, 0.9);
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: static;
      top: auto;
      align-self: stretch;
    }

    .checkout-panel h2 {
      color: #fff;
      font-weight: 800;
      display: block;
      text-align: center;
      text-shadow: none;
    }

    .menu-panel h2 {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .menu-panel {
      flex: 1 1 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel {
      background-color: transparent;
      border-radius: 18px;
      padding: 16px;
      border: none;
      box-shadow: none;
      min-height: 0;
      display: flex;
      flex-direction: column;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      flex: 1;
      min-height: 0;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      padding-right: 4px;
      padding-bottom: 100px;
    }

    .menu-item {
      border: 1px solid rgba(255, 255, 255, 0.6);
      background-color: rgba(255, 255, 255, 0.55);
      border-radius: 12px;
      padding: 8px 10px;
      min-height: 120px;
      text-align: left;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.05s ease, box-shadow 0.15s ease;
      touch-action: pan-y;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.12);
    }

    .menu-item:hover {
      background-color: rgba(255, 255, 255, 0.7);
    }

    .menu-item:active {
      transform: scale(0.98);
    }

    .menu-item strong {
      display: block;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 4px;
      line-height: 1.25;
      color: #212529;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      word-break: break-word;
    }

    .menu-item span {
      font-size: 22px;
      font-weight: 700;
      color: #212529;
      line-height: 1.2;
      text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
    }

    .menu-item.discount {
      border: 1px solid rgba(255, 255, 255, 0.6);
      background-color: rgba(40, 167, 69, 0.65);
      color: #fff;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .menu-item.discount span {
      color: rgba(255, 255, 255, 0.9);
    }

    .cart-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: pan-y;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 12px;
      padding: 10px;
      background-color: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.06);
      max-height: none;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 24px 8px;
      font-size: 18px;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #eceff3;
      padding: 10px 4px;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .item-name {
      font-size: 18px;
      line-height: 1.3;
      color: #111827;
    }

    .item-price {
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      color: #111827;
    }

    .delete-btn {
      border: none;
      background: #fee2e2;
      color: #991b1b;
      font-size: 16px;
      font-weight: 700;
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      min-width: 58px;
      min-height: 42px;
    }

    .total {
      margin: 14px 0;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 800;
      color: #111827;
      text-align: right;
    }

    @supports (-webkit-touch-callout: none) {
      body {
        background-attachment: scroll;
      }
    }

    .order-meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 0 0 14px;
    }

    .order-meta-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .order-meta-field label {
      display: block;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      color: #2e8b57;
      text-shadow: 0 0 6px rgba(57, 255, 20, 0.45);
      margin-bottom: 6px;
    }

    .order-meta-input {
      width: 100%;
      min-height: 56px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      background: #fff;
    }

    .order-meta-input::placeholder {
      font-size: 19px;
      font-weight: 600;
    }

    .order-meta-input:focus {
      outline: 3px solid rgba(37, 99, 235, 0.2);
      border-color: #2563eb;
    }

    .pickup-time-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .pickup-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: flex-start;
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      text-shadow: none;
      padding: 4px 2px;
    }

    /* .order-meta-field label 的綠字會蓋過 .pickup-toggle，須單獨覆寫「啟用預約取餐」 */
    .order-meta-field label.pickup-toggle {
      color: #fff;
      text-shadow: none;
    }

    .pickup-toggle input {
      width: 24px;
      height: 24px;
      accent-color: #16a34a;
    }

    .pickup-time-field.is-hidden {
      display: none;
    }

    .pickup-time-separator {
      font-size: 28px;
      font-weight: 900;
      color: #0f172a;
      line-height: 1;
      text-align: center;
      user-select: none;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .checkout-actions {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      width: 100%;
      margin-top: auto;
      padding-top: 10px;
    }

    .print-ready-panel {
      margin-top: 10px;
      display: none;
    }

    .print-ready-panel.show {
      display: block;
    }

    .print-ready-link {
      display: block;
      width: 100%;
      min-height: 62px;
      line-height: 62px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      color: #fff;
      background: #16a34a;
      border: 2px solid #15803d;
    }

    .actions .btn {
      flex: 1;
    }

    .actions .btn-print {
      flex: 2;
    }

    .btn {
      border: none;
      border-radius: 12px;
      min-height: 58px;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-clear {
      background: var(--danger);
    }

    .btn-checkout {
      background: var(--primary);
    }

    .btn-print {
      background: var(--success);
    }

    .receipt-print {
      display: none;
      width: 80mm;
      margin: 0 auto;
      padding: 5mm 4mm 0;
      background: #fff;
      color: #000;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 14pt;
      line-height: 1.35;
    }

    .receipt-brand {
      margin: 0;
      text-align: center;
      font-size: 16pt;
      font-weight: 900;
      letter-spacing: 0.3px;
    }

    .receipt-meta {
      margin-top: 2mm;
    }

    .receipt-meta-line {
      margin: 0;
      text-align: left;
      font-size: 14pt;
      font-weight: 700;
    }

    .receipt-divider {
      border-top: 1px dashed #000;
      margin: 3mm 0;
    }

    .receipt-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .receipt-table th,
    .receipt-table td {
      padding: 1.5mm 0;
      font-size: 14pt;
      font-weight: 600;
    }

    .receipt-table th:nth-child(1),
    .receipt-table td:nth-child(1) {
      text-align: left;
      width: 52%;
      word-break: break-word;
      padding-right: 2mm;
    }

    .receipt-table th:nth-child(2),
    .receipt-table td:nth-child(2),
    .receipt-table th:nth-child(3),
    .receipt-table td:nth-child(3) {
      text-align: right;
      white-space: nowrap;
      width: 24%;
    }

    .receipt-total {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 16pt;
      font-weight: 900;
      margin: 2mm 0 0;
    }

    .receipt-thanks {
      text-align: center;
      font-size: 14pt;
      font-weight: 700;
      margin: 2mm 0 0;
      padding-bottom: 0;
    }

    .watermark-badge {
      position: fixed;
      bottom: 30px;
      right: 20px;
      z-index: 9999;
      padding: 6px 14px;
      border-radius: 50px;
      background-color: rgba(255, 255, 255, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
      user-select: none;
      pointer-events: none;
    }

    body.modal-open {
      overflow: hidden !important;
    }

    html.modal-open {
      overflow: hidden !important;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 9999;
      pointer-events: auto;
    }

    .modal::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 9990;
      pointer-events: auto;
    }

    .modal.show {
      display: flex;
    }

    .modal-card {
      position: relative;
      z-index: 10000;
      pointer-events: auto !important;
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: #fff;
      border-radius: 16px;
      padding: 18px;
    }

    .modal .btn:active {
      transform: scale(0.97);
      filter: brightness(0.94);
    }

    .report-total {
      background: #eff6ff;
      color: #1d4ed8;
      border-radius: 12px;
      padding: 14px;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .report-list {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .report-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #edf0f4;
      font-size: 18px;
    }

    .report-row:last-child {
      border-bottom: none;
    }

    .ranking-title {
      margin: 8px 0 10px;
      font-size: 20px;
      color: #0f172a;
    }

    .sales-rank-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #edf0f4;
    }

    .sales-rank-row:last-child {
      border-bottom: none;
    }

    .sales-rank-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .sales-rank-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 17px;
      color: #0f172a;
      font-weight: 700;
    }

    .sales-rank-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sales-rank-bar {
      height: 12px;
      border-radius: 999px;
      background: #e2e8f0;
      overflow: hidden;
    }

    .sales-rank-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb, #0ea5e9);
    }

    .modal-actions {
      margin-top: 14px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-close {
      background: #334155;
    }

    .btn-reset {
      background: var(--warning);
    }

    function normalizeInventoryItem(item) {
      if (!item || typeof item !== "object") return null;
      const name = typeof item.name === "string" ? item.name.trim() : "";
      const unit = typeof item.unit === "string" ? item.unit.trim() : "";
      const cost = Number(item.cost);
      const stock = Number(item.stock);
      if (!name || !unit || !Number.isFinite(cost) || cost < 0 || !Number.isFinite(stock)) return null;
      return {
        id: typeof item.id === "string" && item.id ? item.id : "inv_" + Date.now() + "_" + Math.random().toString(16).slice(2),
        name,
        unit,
        cost,
        stock: Math.max(0, stock)
      };
    }

    function loadInventory() {

      try {
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return [];
        return parsed.map((item) => normalizeInventoryItem(item)).filter((item) => item !== null);
      } catch (error) {
        return [];
      }
    }

    function adjustInventoryStock(itemId, isIncrease) {
      const target = inventoryData.find((item) => item.id === itemId);
      if (!target) return;

      const verb = isIncrease ? "進貨" : "減少";
      const input = prompt("請輸入「" + target.name + "」要" + verb + "的數量（單位：" + target.unit + "）：", "1");
      if (input === null) return;
      const amount = Number(input);
      if (!Number.isFinite(amount) || amount <= 0) {
        alert("請輸入大於 0 的有效數量。");
        return;
      }

      if (isIncrease) {
        target.stock += amount;
      } else {
        target.stock = Math.max(0, target.stock - amount);
      }
      saveInventory(inventoryData);
      renderInventoryList();
    }

    function getMonthKey(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, "0");
      return year + "-" + month;
    }

    function getTodayKey(dateObj) {
      const target = dateObj || new Date();
      const year = target.getFullYear();
      const month = String(target.getMonth() + 1).padStart(2, "0");
      const day = String(target.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function buildItemCounts(items) {
      const counts = {};
      MENU_ITEMS.forEach((item) => {
        counts[item.id] = 0;
      });
      items.forEach((item) => {
        if (!Object.prototype.hasOwnProperty.call(counts, item.id)) {
          counts[item.id] = 0;
        }
        counts[item.id] += 1;
      });
      return counts;
    }

    function safeNormalizeOrder(order) {
      if (!order || typeof order !== "object") return null;
      if (typeof order.date !== "string" || typeof order.month !== "string") return null;
      const total = Number(order.total);
      if (!Number.isFinite(total)) return null;
      if (!order.itemCounts || typeof order.itemCounts !== "object") return null;

      const safeCounts = {};
      MENU_ITEMS.forEach((item) => {
        const value = Number(order.itemCounts[item.id]);
        safeCounts[item.id] = Number.isFinite(value) ? Math.max(0, Math.floor(value)) : 0;
      });

      return {
        date: order.date,
        month: order.month,
        total,
        itemCounts: safeCounts,
        timestamp: typeof order.timestamp === "string" ? order.timestamp : new Date().toISOString(),
        orderNo: Number.isFinite(Number(order.orderNo)) ? Math.floor(Number(order.orderNo)) : 0,
        status:
          order.status === "voided"
            ? "voided"
            : order.status === "pending"
              ? "pending"
              : "active",
        lineItems: Array.isArray(order.lineItems) ? order.lineItems : [],
        is_daily_cleared: order.is_daily_cleared === true,
        table_number: typeof order.table_number === "string" && order.table_number.trim()
          ? order.table_number.trim()
          : DEFAULT_TABLE_NUMBER,
        pickup_time: typeof order.pickup_time === "string" && order.pickup_time.trim()
          ? order.pickup_time.trim()
          : "",
        source: typeof order.source === "string" ? order.source : "",
        customer_name: typeof order.customer_name === "string" ? order.customer_name.trim() : "",
        customer_phone: typeof order.customer_phone === "string" ? order.customer_phone.trim() : ""
      };
    }

    function firestoreTimestampToIso(value) {
      if (value && typeof value.toDate === "function") {
        return value.toDate().toISOString();
      }
      if (typeof value === "string") return value;
      return new Date().toISOString();
    }

    function orderFromFirestoreDoc(docSnap) {
      const data = docSnap.data();
      if (!data || typeof data !== "object") return null;
      const normalized = safeNormalizeOrder({
        ...data,
        timestamp: firestoreTimestampToIso(data.timestamp)
      });
      if (!normalized) return null;
      return { ...normalized, id: docSnap.id };
    }

    async function fetchOrdersByDate(todayKey) {
      const q = query(collection(db, ORDERS_COLLECTION), where("date", "==", todayKey));
      const snap = await getDocs(q);
      const list = [];
      snap.forEach((docSnap) => {
        const o = orderFromFirestoreDoc(docSnap);
        if (o) list.push(o);
      });
      return list;
    }

    async function fetchOrdersByMonth(monthKey) {
      const q = query(collection(db, ORDERS_COLLECTION), where("month", "==", monthKey));
      const snap = await getDocs(q);
      const list = [];
      snap.forEach((docSnap) => {
        const o = orderFromFirestoreDoc(docSnap);
        if (o) list.push(o);
      });
      return list;
    }

    async function ensureProductsSeededIfEmpty() {
      if (productsSeedChecked) return;
      if (productsSeedPromise) {
        await productsSeedPromise;
        return;
      }
      productsSeedPromise = (async () => {
        const snap = await getDocs(collection(db, PRODUCTS_COLLECTION));
        if (!snap.empty) {
          productsSeedChecked = true;
          return;
        }
        const batch = writeBatch(db);
        MENU_ITEMS.forEach((item, index) => {
          const ref = doc(db, PRODUCTS_COLLECTION, item.id);
          batch.set(ref, {
            id: item.id,
            name: item.name,
            price: item.price,
            discount: item.discount === true,
            sortOrder: index,
            enabled: true
          });
        });
        await batch.commit();
        productsSeedChecked = true;
        console.info("Firestore products 集合為空，已從店內 MENU_ITEMS 自動建立菜單文件。");
      })();
      try {
        await productsSeedPromise;
      } finally {
        productsSeedPromise = null;
      }
    }

      await addDoc(collection(db, ORDERS_COLLECTION), {

        timestamp: Timestamp.fromDate(checkoutTime),
        orderNo,

        is_daily_cleared: false
      });

    function createSummaryFromOrders(orders) {
      const summary = createInitialReport();
      orders.forEach((order) => {
        if (order.status === "voided" || order.status === "pending") return;
        summary.totalRevenue += order.total;
        MENU_ITEMS.forEach((item) => {
          summary.itemCounts[item.id] += order.itemCounts[item.id] || 0;
        });
      });
      return summary;
    }

    function formatOrderNumber(number) {
      return String(number).padStart(3, "0");
    }

    function getCounterState() {
      const today = getTodayKey();
      const fallback = { date: today, nextNumber: 1 };
      const raw = localStorage.getItem(ORDER_COUNTER_KEY);
      if (!raw) return fallback;

      try {
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return fallback;
        if (parsed.date !== today) return fallback;
        const safeNext = Number.isFinite(parsed.nextNumber) && parsed.nextNumber > 0 ? Math.floor(parsed.nextNumber) : 1;
        return { date: today, nextNumber: safeNext };
      } catch (error) {
        return fallback;
      }
    }

    function saveCounterState(state) {
      localStorage.setItem(ORDER_COUNTER_KEY, JSON.stringify(state));
    }

    function issueOrderNumber() {
      const state = getCounterState();
      const current = state.nextNumber;
      saveCounterState({ date: state.date, nextNumber: current + 1 });
      return current;
    }

    function resetTodayOrderCounter() {
      saveCounterState({ date: getTodayKey(), nextNumber: 1 });
    }

    function formatDateTime(dateObj) {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, "0");
      const day = String(dateObj.getDate()).padStart(2, "0");
      const hours = String(dateObj.getHours()).padStart(2, "0");
      const minutes = String(dateObj.getMinutes()).padStart(2, "0");
      const seconds = String(dateObj.getSeconds()).padStart(2, "0");
      return year + "/" + month + "/" + day + " " + hours + ":" + minutes + ":" + seconds;
    }

    function formatTwoDigits(value) {
      return String(value).padStart(2, "0");
    }

    function getCurrentTimeValue() {
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const roundedMinutes = Math.ceil(currentMinutes / 5) * 5;
      const safeMinutes = Math.min(roundedMinutes, 23 * 60 + 55);
      const hours = formatTwoDigits(Math.floor(safeMinutes / 60));
      const minutes = formatTwoDigits(safeMinutes % 60);
      return hours + ":" + minutes;
    }

    function buildPickupTimeSelectOptions() {
      if (!pickupHourSelect || !pickupMinuteSelect) return;
      pickupHourSelect.innerHTML = "";
      pickupMinuteSelect.innerHTML = "";

      for (let hour = 0; hour <= 23; hour += 1) {
        const value = formatTwoDigits(hour);
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        pickupHourSelect.appendChild(option);
      }

      for (let minute = 0; minute <= 55; minute += 5) {
        const value = formatTwoDigits(minute);
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        pickupMinuteSelect.appendChild(option);
      }
    }

    function timeStringToMinutes(timeValue) {
      if (typeof timeValue !== "string" || !timeValue.includes(":")) return NaN;
      const [hoursText, minutesText] = timeValue.split(":");
      const hours = Number(hoursText);
      const minutes = Number(minutesText);
      if (!Number.isInteger(hours) || !Number.isInteger(minutes)) return NaN;
      if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59) return NaN;
      return hours * 60 + minutes;
    }

    function ensurePickupTimeDefault() {
      if (!pickupHourSelect || !pickupMinuteSelect) return;
      if (!pickupHourSelect.value || !pickupMinuteSelect.value) {
        const timeValue = getCurrentTimeValue();
        const [hour, minute] = timeValue.split(":");
        pickupHourSelect.value = hour;
        pickupMinuteSelect.value = minute;
      }
    }

    function getSelectedPickupTime() {
      ensurePickupTimeDefault();
      const hour = pickupHourSelect ? pickupHourSelect.value : "";
      const minute = pickupMinuteSelect ? pickupMinuteSelect.value : "";
      return hour && minute ? hour + ":" + minute : getCurrentTimeValue();
    }

    function resolveCheckoutMeta() {
      const rawTable = tableNumberInput ? tableNumberInput.value.trim() : "";
      if (REQUIRE_TABLE_NUMBER && !rawTable) {
        alert("請先輸入桌號，才能確認結帳。");
        return null;
      }
      const tableNumber = rawTable || DEFAULT_TABLE_NUMBER;
      const isReservation = isPickupReservationEnabled();
      let pickupTime = "現場";
      if (isReservation) {
        pickupTime = getSelectedPickupTime();
        const pickupMinutes = timeStringToMinutes(pickupTime);
        const now = new Date();
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        if (!Number.isFinite(pickupMinutes) || pickupMinutes < nowMinutes) {
          alert("⚠️ 取餐時間不能早於現在時間喔！請重新確認。");
          return null;
        }
      }
      return { tableNumber, pickupTime, isReservation };
    }

    function buildReceiptSummary(orderItems) {

      orderItems.forEach((item) => {

        map[item.id].qty += 1;

    function fillReceipt(orderItems, orderNumber, checkoutTime, tableNumber, pickupTime) {
      if (receiptTableNumber) {
        receiptTableNumber.textContent = "桌號：" + (tableNumber || DEFAULT_TABLE_NUMBER);

      if (receiptPickupTime) {
        receiptPickupTime.textContent = "預約取餐時間：" + (pickupTime || "即時");
      }
      if (receiptOrderNo) {
        receiptOrderNo.textContent = "訂單編號：" + formatOrderNumber(orderNumber);
      }
      receiptItems.innerHTML = "";

      const summary = buildReceiptSummary(orderItems);
      summary.forEach((line) => {
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" +
          line.name +
          "</td>" +
          "<td>" +
          line.qty +
          "</td>" +
          "<td>" +
          formatMoney(line.unitPrice) +
          "</td>";
        receiptItems.appendChild(tr);
      });

      const total = orderItems.reduce((sum, item) => sum + item.price, 0);
      receiptTotal.textContent = formatMoney(total);
    }

      [reportModal, monthlyReportModal, monthlyRankingModal, historyModal, inventoryModal].forEach((modal) => {

      const hasOpenModal = [reportModal, monthlyReportModal, monthlyRankingModal, historyModal, inventoryModal].some(
        (modal) => modal && modal.classList.contains("show")
      );
      document.body.classList.toggle("modal-open", hasOpenModal);

    function prepareOrderForCheckout() {
      if (cart.length === 0) {
        return null;
      }
      const checkoutMeta = resolveCheckoutMeta();
      if (!checkoutMeta) return null;
      const snapshot = cart.map((item) => ({ id: item.id, name: item.name, price: item.price }));
      const checkoutTime = new Date();
      const orderNo = issueOrderNumber();
      fillReceipt(snapshot, orderNo, checkoutTime, checkoutMeta.tableNumber, checkoutMeta.pickupTime);
      return {
        snapshot,
        checkoutTime,
        orderNo,
        tableNumber: checkoutMeta.tableNumber,
        pickupTime: checkoutMeta.pickupTime,
        isReservation: checkoutMeta.isReservation
      };
    }

    async function saveOrder() {
      const preparedOrder = prepareOrderForCheckout();
      if (!preparedOrder) return null;
      await persistNewOrderToFirestore(
        preparedOrder.snapshot,
        preparedOrder.checkoutTime,
        preparedOrder.orderNo,
        preparedOrder.tableNumber,
        preparedOrder.pickupTime
      );
      return preparedOrder;

        preparedOrder.orderNo,

        preparedOrder.pickupTime

    function collectSalesRanking(summary) {
      return MENU_ITEMS.map((item) => ({
        id: item.id,
        name: item.name,
        qty: summary.itemCounts[item.id] || 0
      }))
        .filter((entry) => entry.qty > 0)
        .sort((a, b) => b.qty - a.qty);

    function renderSalesRanking(listElement, ranking, emptyText) {
      listElement.innerHTML = "";
      if (ranking.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = emptyText;
        listElement.appendChild(empty);
        return;
      }

      const maxQty = ranking[0].qty;
      ranking.forEach((entry, index) => {
        const widthPercent = maxQty > 0 ? Math.max(8, (entry.qty / maxQty) * 100) : 0;
        const row = document.createElement("div");
        row.className = "sales-rank-row";
        row.innerHTML =
          '<div class="sales-rank-main">' +
          '<div class="sales-rank-top">' +
          '<span class="sales-rank-name">' +
          (index + 1) +
          ". " +
          entry.name +
          "</span>" +
          "<strong>" +
          entry.qty +
          " 份</strong>" +
          "</div>" +
          '<div class="sales-rank-bar"><div class="sales-rank-bar-fill" style="width:' +
          widthPercent +
          '%;"></div></div>' +
          "</div>" +
          '<div>' +
          entry.qty +
          " 份</div>";
        listElement.appendChild(row);
      });

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // ===== RawBT 收據列印（Canvas → ESC/POS raster → rawbt:base64,...）=====
    // 80mm 熱感應紙標準解析度寬度（必須為 8 的倍數，與 ESC/POS GS v 0 對齊）
    const RECEIPT_WIDTH_PX = 576;
    // 第一張（明細）點陣印完後的推紙（ESC J）：須把整張含「總計」推出裁刀區再下第一刀；過短會像文字沒印完就切、總計黏到第二張頂端
    const FEED_BETWEEN_RECEIPTS_DOTS = 330;
    // 第二張影像「之前」的推紙點數，把工作單標題從第一刀切口略往下推（與第一張尾端推紙一併微調後可略縮）
    const FEED_BEFORE_WORK_IMAGE_DOTS = 96;
    // 第二張僅在畫布內縮頂留白上移內容（不調整 FEED_BEFORE／第一張）；32px ≈ 4mm（203dpi 縱向約 8 dot/mm）
    const WORK_CANVAS_TOP_SHIFT_UP_PX = 32;
    const WORK_TOP_INSET_SAVE_PX = 20; // 24 → 4
    const WORK_BRAND_GAP_AFTER_PX = 70 - (WORK_CANVAS_TOP_SHIFT_UP_PX - WORK_TOP_INSET_SAVE_PX); // 58，與上兩項合計省 32px
    // 第二張結束後推紙：工作單點陣變矮時補回等量 dots，維持「謝謝惠顧」通過裁刀的裕度
    const FEED_AFTER_FINAL_DOTS = 220 + WORK_CANVAS_TOP_SHIFT_UP_PX;
    // 工作單 canvas 最小高度與底部留白（謝謝惠顧下方保留適度白邊，搭配 FEED_AFTER_FINAL）
    const WORK_CANVAS_MIN_HEIGHT_PX = 250;
    const WORK_CANVAS_BOTTOM_PAD_PX = 72;

    function drawDashedDivider(ctx, x1, y, x2) {
      ctx.save();
      ctx.strokeStyle = "#000";
      ctx.lineWidth = 2;
      ctx.setLineDash([10, 6]);
      ctx.beginPath();
      ctx.moveTo(x1, y + 1);
      ctx.lineTo(x2, y + 1);
      ctx.stroke();
      ctx.restore();
    }

    function wrapTextToWidth(ctx, text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return [text];
      const lines = [];
      let current = "";
      for (const ch of text) {
        const test = current + ch;
        if (ctx.measureText(test).width > maxWidth && current.length > 0) {
          lines.push(current);
          current = ch;
        } else {
          current = test;
        }
      }
      if (current) lines.push(current);
      return lines;
    }

    /** 列印用：僅顯示首字，其餘以全形「Ｏ」代替（不修改資料庫） */
    function maskCustomerNameForPrint(name) {
      const s = typeof name === "string" ? name.trim() : "";
      if (!s) return "";
      const chars = Array.from(s);
      const first = chars[0] || "";
      if (chars.length <= 1) return first;
      return first + "Ｏ".repeat(chars.length - 1);
    }

    /** 列印標頭顧客列專用：僅顯示末三碼，其餘以 * 代替（不修改資料庫） */
    function maskCustomerPhoneLastThreeForPrint(phone) {
      const digits = String(phone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.length <= 3) return "***" + digits;
      return "***" + digits.slice(-3);
    }

    /** 列印用：台灣手機 10 碼為前 4 + ** + 後 3；其餘號碼則遮罩中段（不修改資料庫） */
    function maskCustomerPhoneForPrint(phone) {
      const digits = String(phone || "").replace(/\D/g, "");
      if (!digits) return "";
      if (digits.length === 10) {
        return digits.slice(0, 4) + "**" + digits.slice(-3);
      }
      if (digits.length < 7) {
        return digits.slice(0, 2) + "**";
      }
      const head = Math.min(4, Math.floor(digits.length / 3));
      const tail = Math.min(3, Math.floor(digits.length / 3));
      const midLen = Math.max(digits.length - head - tail, 2);
      return digits.slice(0, head) + "**" + digits.slice(digits.length - tail);
    }

    /** 列印標頭「(取餐：HH:MM)」用；非 HH:MM 則原樣輸出（不含「現場」）。 */
    function formatPickupTimeForPrintHeader(pickupTimeRaw) {
      const s = String(pickupTimeRaw || "").trim();
      if (!s || s === "現場") return "";
      const m = /^(\d{1,2}):(\d{2})$/.exec(s);
      if (!m) return s;
      const h = Math.max(0, Math.min(23, parseInt(m[1], 10)));
      const mi = Math.max(0, Math.min(59, parseInt(m[2], 10)));
      return String(h).padStart(2, "0") + ":" + String(mi).padStart(2, "0");
    }

    /**
     * 列印用顧客列（隱碼後）；無姓名且無電話則回傳空字串（不印、不留空行）。
     * 格式：顧客：[姓]ＯＯ / ***末三碼 (取餐：HH:MM)
     */
    function buildMaskedCustomerPrintLine(preparedOrder) {
      if (!preparedOrder || typeof preparedOrder !== "object") return "";
      const rawName = typeof preparedOrder.customer_name === "string" ? preparedOrder.customer_name.trim() : "";
      const rawPhone = typeof preparedOrder.customer_phone === "string" ? preparedOrder.customer_phone.trim() : "";
      const maskedName = maskCustomerNameForPrint(rawName);
      const maskedPhone = maskCustomerPhoneLastThreeForPrint(rawPhone);
      if (!maskedName && !maskedPhone) return "";
      let line =
        maskedName && maskedPhone
          ? "顧客：" + maskedName + " / " + maskedPhone
          : maskedName
            ? "顧客：" + maskedName
            : "顧客：" + maskedPhone;
      const pickupFmt = formatPickupTimeForPrintHeader(
        preparedOrder.pickupTime ? String(preparedOrder.pickupTime) : ""
      );
      if (pickupFmt) {
        line += " (取餐：" + pickupFmt + ")";
      }
      return line;
    }

    /**
     * 繪製收據內容（店名、meta、明細品項＋總計 或 工作單＋致謝），回傳最後 y（總計／致謝後已含 y+=）。
     * 明細單請先畫在高度足夠的 canvas 上量測 y，再依 y 設定正式 tmp 高度重畫，避免「總計」被裁切後印到第二張頂端。
     */
    function paintReceiptBody(
      ctx,
      preparedOrder,
      kind,
      summary,
      W,
      PAD_X,
      FONT_BRAND,
      FONT_META,
      FONT_TABLE,
      FONT_TOTAL,
      FONT_THANKS
    ) {
      const isDetail = kind !== "work";
      let y = isDetail ? 24 : 24 - WORK_TOP_INSET_SAVE_PX;

      ctx.font = FONT_BRAND;
      ctx.textAlign = "center";
      ctx.fillStyle = "#000";
      ctx.fillText("Kuanbao", W / 2, y);
      y += isDetail ? 70 : WORK_BRAND_GAP_AFTER_PX;

      ctx.font = FONT_META;
      ctx.textAlign = "left";
      const metaLineHeight = 52;
      function drawMetaLine(text) {
        ctx.fillText(text, PAD_X, y);
        y += metaLineHeight;
      }

      const tableNumber = preparedOrder.tableNumber || DEFAULT_TABLE_NUMBER;
      const checkoutTimeText = formatDateTime(preparedOrder.checkoutTime);
      const orderNoText = formatOrderNumber(preparedOrder.orderNo);
      const pickupTimeRaw = preparedOrder.pickupTime ? String(preparedOrder.pickupTime).trim() : "";
      const orderTypeText = preparedOrder.isReservation
        ? "預約取餐：" + (pickupTimeRaw || "現場候位")
        : "單別：現場單";

      drawMetaLine("桌號：" + tableNumber);
      const maskedCustomerPrintLine = buildMaskedCustomerPrintLine(preparedOrder);
      if (maskedCustomerPrintLine) {
        drawMetaLine(maskedCustomerPrintLine);
      }
      drawMetaLine("時間：" + checkoutTimeText);
      drawMetaLine("訂單編號：" + orderNoText);
      drawMetaLine(orderTypeText);

      if (isDetail) {
        y += 8;
        drawDashedDivider(ctx, PAD_X, y, W - PAD_X);
        y += 24;

        ctx.font = FONT_TABLE;
        const COL_ITEM_LEFT = PAD_X;
        const COL_QTY_X = Math.round(W * 0.62);
        const COL_PRICE_RIGHT = W - PAD_X;
        const ITEM_MAX_WIDTH = COL_QTY_X - COL_ITEM_LEFT - 16;

        ctx.textAlign = "left";
        ctx.fillText("品項", COL_ITEM_LEFT, y);
        ctx.textAlign = "center";
        ctx.fillText("數量", COL_QTY_X, y);
        ctx.textAlign = "right";
        ctx.fillText("單價", COL_PRICE_RIGHT, y);
        y += 50;

        summary.forEach((line) => {
          const qtyText = "x" + line.qty;
          const priceText = formatMoney(line.unitPrice);
          const wrapped = wrapTextToWidth(ctx, line.name, ITEM_MAX_WIDTH);
          wrapped.forEach((wrappedLine, i) => {
            ctx.textAlign = "left";
            ctx.fillText(wrappedLine, COL_ITEM_LEFT, y);
            if (i === 0) {
              ctx.textAlign = "center";
              ctx.fillText(qtyText, COL_QTY_X, y);
              ctx.textAlign = "right";
              ctx.fillText(priceText, COL_PRICE_RIGHT, y);
            }
            y += 50;
          });
        });

        y += 8;
        drawDashedDivider(ctx, PAD_X, y, W - PAD_X);
        y += 24;

        ctx.font = FONT_TOTAL;
        ctx.textAlign = "right";
        const totalText = formatMoney(
          preparedOrder.snapshot.reduce((sum, item) => sum + Number(item.price || 0), 0)
        );
        ctx.fillText("總計：" + totalText, W - PAD_X, y);
        y += 52;
      } else {
        y += 40;
        ctx.font = FONT_THANKS;
        ctx.textAlign = "center";
        ctx.fillText("謝謝惠顧！", W / 2, y);
        y += 56;
      }

      return y;
    }

    async function renderReceiptToCanvas(preparedOrder, kind) {
      // 等所有字型載入完成，避免 fallback 字型造成版面跑掉
      if (document.fonts && document.fonts.ready) {
        try { await document.fonts.ready; } catch (e) { /* ignore */ }
      }

      const isDetail = kind !== "work";
      const summary = isDetail ? buildReceiptSummary(preparedOrder.snapshot) : [];

      const W = RECEIPT_WIDTH_PX;
      const PAD_X = 16;

      const FONT_FAMILY = "'Noto Sans TC','Microsoft JhengHei','PingFang TC','Heiti TC',sans-serif";
      const FONT_BRAND = "900 56px " + FONT_FAMILY;
      const FONT_META = "700 40px " + FONT_FAMILY;
      const FONT_TABLE = "700 38px " + FONT_FAMILY;
      const FONT_TOTAL = "900 50px " + FONT_FAMILY;
      const FONT_THANKS = "700 40px " + FONT_FAMILY;

      const fontArgs = [FONT_BRAND, FONT_META, FONT_TABLE, FONT_TOTAL, FONT_THANKS];

      // 明細：先在高畫布實際繪製取得真實 y（與 measureText 換行一致），再依 y 設 tmp 重畫，杜絕「總計」被裁切
      const DETAIL_MEASURE_CANVAS_H = 20000;

      const tmp = document.createElement("canvas");
      tmp.width = W;

      let y;
      if (isDetail) {
        const scratch = document.createElement("canvas");
        scratch.width = W;
        scratch.height = DETAIL_MEASURE_CANVAS_H;
        const sctx = scratch.getContext("2d");
        sctx.fillStyle = "#fff";
        sctx.fillRect(0, 0, W, DETAIL_MEASURE_CANVAS_H);
        sctx.textBaseline = "top";
        y = paintReceiptBody(
          sctx,
          preparedOrder,
          "detail",
          summary,
          W,
          PAD_X,
          ...fontArgs
        );
        const bottomPadDetail = 72;
        const contentH = y + bottomPadDetail;
        // 勿強制 min 2400：過長空白點陣＋過短推紙時，部分機種尾端易與裁切錯位；改依實際內容高度＋余白
        tmp.height = Math.min(20000, Math.max(500, contentH + 120));
      } else {
        tmp.height = 1400;
      }

      const ctx = tmp.getContext("2d");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, W, tmp.height);
      ctx.fillStyle = "#000";
      ctx.textBaseline = "top";
      y = paintReceiptBody(ctx, preparedOrder, kind, summary, W, PAD_X, ...fontArgs);

      const minHeight = isDetail ? 0 : WORK_CANVAS_MIN_HEIGHT_PX;
      const bottomPad = isDetail ? 72 : WORK_CANVAS_BOTTOM_PAD_PX;
      const finalH = Math.max(y + bottomPad, minHeight);
      if (isDetail && finalH > tmp.height) {
        tmp.height = Math.min(20000, finalH + 80);
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, W, tmp.height);
        ctx.fillStyle = "#000";
        y = paintReceiptBody(ctx, preparedOrder, kind, summary, W, PAD_X, ...fontArgs);
      }

      const finalCanvas = document.createElement("canvas");
      finalCanvas.width = W;
      finalCanvas.height = finalH;
      const finalCtx = finalCanvas.getContext("2d");
      finalCtx.fillStyle = "#fff";
      finalCtx.fillRect(0, 0, W, finalH);
      const copyH = Math.min(tmp.height, finalH);
      finalCtx.drawImage(tmp, 0, 0, W, copyH, 0, 0, W, copyH);
      return finalCanvas;
    }

    // 把 canvas 轉為 1-bit raster bitmap（ESC/POS GS v 0 用的格式）
    function canvasToRasterBitmap(canvas) {
      const ctx = canvas.getContext("2d");
      const W = canvas.width;
      const H = canvas.height;
      const imageData = ctx.getImageData(0, 0, W, H);
      const data = imageData.data;
      const widthBytes = Math.ceil(W / 8);
      const bitmap = new Uint8Array(widthBytes * H);
      for (let yy = 0; yy < H; yy++) {
        for (let xx = 0; xx < W; xx++) {
          const idx = (yy * W + xx) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const a = data[idx + 3];
          const gray = r * 0.299 + g * 0.587 + b * 0.114;
          if (a > 128 && gray < 128) {
            bitmap[yy * widthBytes + (xx >> 3)] |= 1 << (7 - (xx & 7));
          }
        }
      }
      return { widthBytes: widthBytes, height: H, bitmap: bitmap };
    }

    function appendRasterImage(out, raster) {
      out.push(0x1D, 0x76, 0x30, 0x00); // GS v 0 m=0 — raster image
      out.push(raster.widthBytes & 0xFF, (raster.widthBytes >> 8) & 0xFF);
      out.push(raster.height & 0xFF, (raster.height >> 8) & 0xFF);
      for (let i = 0; i < raster.bitmap.length; i++) out.push(raster.bitmap[i]);
    }

    function appendFeedDots(out, dots) {
      let remaining = Math.max(0, Number(dots) || 0);
      while (remaining > 0) {
        const chunk = Math.min(255, remaining);
        out.push(0x1B, 0x4A, chunk); // ESC J n — feed n dots
        remaining -= chunk;
      }
    }

    function appendFullCut(out) {
      out.push(0x1D, 0x56, 0x00); // GS V 0 — 全切（Function A）
    }

    // 「單一包裹」策略：把兩張 canvas 的 raster + 兩個切刀指令合併成單一 ESC/POS bytes
    // 順序：ESC@ → 明細圖 → ESC J 推紙 → 切刀 → ESC J 推紙 → 工作單圖 → ESC J 推紙 → 切刀
    // 一次 rawbt:base64,... URL 送出，徹底繞過 PWA 雙觸發限制
    function buildCombinedReceiptBytes(detailCanvas, workCanvas) {
      const detailRaster = canvasToRasterBitmap(detailCanvas);
      const workRaster = canvasToRasterBitmap(workCanvas);

      const out = [];
      out.push(0x1B, 0x40); // ESC @ — 初始化

      // —— 第一張：明細單 ——
      appendRasterImage(out, detailRaster);
      // 長單點陣較高時略增推紙，避免裁刀切在尾端墨迹尚未完全離開感應區
      const detailTailFeed = Math.min(280, Math.max(0, Math.floor((detailCanvas.height || 0) / 14)));
      appendFeedDots(out, FEED_BETWEEN_RECEIPTS_DOTS + detailTailFeed);
      appendFullCut(out);                              // 第一刀

      // —— 第二張：工作單 ——
      appendFeedDots(out, FEED_BEFORE_WORK_IMAGE_DOTS); // 把工作單標題從第一刀切口往下推
      appendRasterImage(out, workRaster);
      appendFeedDots(out, FEED_AFTER_FINAL_DOTS);       // 致謝語＋尾端留白推過裁刀
      appendFullCut(out);                               // 第二刀

      return new Uint8Array(out);
    }

    function bytesToBase64(bytes) {
      // 大型 byte array 用 chunk 處理，避免 String.fromCharCode 的 call size 限制
      let binary = "";
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function buildRawBtDeepLink(escPosBytes) {
      return "rawbt:base64," + bytesToBase64(escPosBytes);
    }

    /**
     * 與「結帳並列印」共用：依 preparedOrder 產生 RawBT 合併 ESC/POS 並導向列印（明細 + 工作單）。
     * 不寫入 Firestore、不清空購物車；呼叫端須先完成接單／結帳等商業邏輯。
     */

    // 診斷用：數 canvas 內黑色像素，下次測試若有問題可立刻判斷 canvas 是否真的有內容
    function countBlackPixels(canvas) {
      const ctx = canvas.getContext("2d");
      const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let count = 0;
      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        if (data[i + 3] > 128 && gray < 128) count++;
      }
      return count;
    }

    async function removeOneItemFromOrder(filteredIndex, itemId, itemName) {
      let todayOrders;
      try {
        todayOrders = await getTodayOrdersSorted();
      } catch (error) {
        console.error(error);
        alert("載入訂單失敗：" + (error && error.message ? error.message : String(error)));
        return;
      }

      const target = todayOrders[filteredIndex];
      if (!target || target.status === "voided" || !target.id) return;

      const currentQty = target.itemCounts[itemId] || 0;
      if (currentQty <= 0) return;

      const confirmed = confirm("確定要從此訂單中退除 1 份 " + itemName + " 嗎？");
      if (!confirmed) return;

      const nextCounts = { ...target.itemCounts };
      nextCounts[itemId] = Math.max(0, (nextCounts[itemId] || 0) - 1);

      const nextLineItems = Array.isArray(target.lineItems) ? target.lineItems.slice() : [];
      if (nextLineItems.length > 0) {
        const removeAt = nextLineItems.findIndex((line) => line && line.id === itemId);
        if (removeAt >= 0) nextLineItems.splice(removeAt, 1);
      }

      let recalculatedTotal = 0;
      MENU_ITEMS.forEach((menuItem) => {
        const qty = nextCounts[menuItem.id] || 0;
        recalculatedTotal += menuItem.price * qty;
      });

      const remainingCount = MENU_ITEMS.reduce((sum, menuItem) => sum + (nextCounts[menuItem.id] || 0), 0);
      const nextStatus = remainingCount <= 0 || recalculatedTotal === 0 ? "voided" : target.status;

      try {
        await updateDoc(doc(db, ORDERS_COLLECTION, target.id), {
          itemCounts: nextCounts,
          lineItems: nextLineItems,
          total: recalculatedTotal,
          status: nextStatus
        });
      } catch (error) {
        console.error(error);
        alert("更新失敗：" + (error && error.message ? error.message : String(error)));
        return;
      }

      expandedHistoryOrderId = nextStatus === "voided" ? null : target.id;
      await renderHistoryList(historyTab);
      alert("已退除 1 份「" + itemName + "」。");
    }

    function applyImportedData(rawText) {
      let parsed;
      try {
        parsed = JSON.parse(rawText);
      } catch (error) {
        alert("匯入失敗：檔案不是有效的 JSON。");
        return;
      }

      const incoming = parsed && typeof parsed === "object" && parsed.data && typeof parsed.data === "object"
        ? parsed.data
        : parsed;
      if (!incoming || typeof incoming !== "object" || Array.isArray(incoming)) {
        alert("匯入失敗：資料格式不正確。");
        return;
      }

      const confirmed = confirm("匯入會覆蓋目前系統資料，確定要繼續嗎？");
      if (!confirmed) return;

      localStorage.clear();
      Object.keys(incoming).forEach((key) => {
        const value = incoming[key];
        if (typeof value === "string") {
          localStorage.setItem(key, value);
        } else {
          localStorage.setItem(key, JSON.stringify(value));
        }
      });

      alert("匯入成功，將重新整理頁面。");
      window.location.reload();
    }

    function playNewCloudOrderChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        const ctx = new Ctx();
        const master = ctx.createGain();
        master.connect(ctx.destination);
        master.gain.setValueAtTime(0.0001, ctx.currentTime);
        master.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + 0.02);
        master.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.55);

        function ding(freq, start, dur) {
          const o = ctx.createOscillator();
          o.type = "sine";
          o.frequency.setValueAtTime(freq, start);
          o.connect(master);
          o.start(start);
          o.stop(start + dur);
        }

        const t0 = ctx.currentTime;
        ding(784, t0, 0.12);
        ding(659, t0 + 0.11, 0.14);

        window.setTimeout(() => {
          try {
            ctx.close();
          } catch (e2) {
            /* ignore */
          }
        }, 900);
      } catch (e) {
        console.warn("Cloud order chime skipped:", e);
      }
    }

    function summarizeLineItemsForDisplay(lineItems) {

          typeof line.name === "string" && line.name.trim() ? line.name.trim() : String(line.id || "");
        map[key] = (map[key] || 0) + 1;
      });
      const parts = Object.keys(map).map((name) => name + " ×" + map[name]);
      return parts.length ? parts.join("、") : "（無品項）";
    }

    function startCloudPendingOrdersListener() {

      cloudOrdersUnsubscribe = onSnapshot(

        (snapshot) => {
          if (!cloudOrdersFirstSnapshot) {
            snapshot.docChanges().forEach((change) => {
              if (change.type === "added") {
                playNewCloudOrderChime();
              }
            });
          }
          cloudOrdersFirstSnapshot = false;
          const todayKey = getTodayKey();
          const list = [];
          snapshot.forEach((docSnap) => {
            const o = orderFromFirestoreDoc(docSnap);
            if (!o || o.date !== todayKey) return;
            if (o.status !== "pending" || o.source !== CUSTOMER_ORDER_SOURCE) return;
            list.push(o);
          });
          list.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
          renderCloudPendingUi(list);
        },
        (error) => {
          console.error("雲端待接單監聽失敗：", error);
        }
      );
    }

    async function acceptCloudMobilePendingOrder(order) {
      if (!order || !order.id) return;
      if (acceptingCloudOrderId) return;
      acceptingCloudOrderId = order.id;
      if (cloudPendingList) {
        cloudPendingList.querySelectorAll(".cloud-accept-btn").forEach((b) => {
          b.disabled = true;
        });
      }

      const newNo = issueOrderNumber();
      try {
        await runTransaction(db, async (transaction) => {
          const ref = doc(db, ORDERS_COLLECTION, order.id);
          const snap = await transaction.get(ref);
          if (!snap.exists()) {
            throw new Error("ORDER_NOT_FOUND");
          }
          const d = snap.data();
          if (!d || d.status !== "pending" || d.source !== CUSTOMER_ORDER_SOURCE) {
            throw new Error("ORDER_NOT_PENDING");
          }
          transaction.update(ref, {
            status: "active",
            orderNo: newNo
          });
        });
      } catch (error) {
        console.error(error);
        const msg = error && error.message ? error.message : String(error);
        if (msg === "ORDER_NOT_FOUND" || msg === "ORDER_NOT_PENDING") {
          alert("此訂單不存在或已被其他人接單。");
        } else {
          alert("接單失敗：" + msg);
        }
        acceptingCloudOrderId = null;
        if (cloudPendingList) {
          cloudPendingList.querySelectorAll(".cloud-accept-btn").forEach((b) => {
            b.disabled = false;
          });
        }
        return;
      }

      acceptingCloudOrderId = null;
      if (cloudPendingList) {
        cloudPendingList.querySelectorAll(".cloud-accept-btn").forEach((b) => {
          b.disabled = false;
        });
      }

      const preparedOrder = {
        snapshot: (order.lineItems || []).map((x) => ({
          id: x.id,
          name: x.name,
          price: Number(x.price) || 0
        })),
        checkoutTime: new Date(order.timestamp),
        orderNo: newNo,
        tableNumber: order.table_number || DEFAULT_TABLE_NUMBER,
        pickupTime: order.pickup_time || "",
        isReservation: !!(typeof order.pickup_time === "string" && order.pickup_time.trim()),
        customer_name: typeof order.customer_name === "string" ? order.customer_name : "",
        customer_phone: typeof order.customer_phone === "string" ? order.customer_phone : ""
      };

      forceCloseUiBeforePrint();
      try {
        if (checkoutPrintBtn) checkoutPrintBtn.disabled = true;
        if (checkoutBtn) checkoutBtn.disabled = true;
        await executeRawBtMergedPrintFromPreparedOrder(preparedOrder);
        window.setTimeout(() => {
          if (checkoutPrintBtn) checkoutPrintBtn.disabled = false;
          if (checkoutBtn) checkoutBtn.disabled = false;
          alert("已接單並送出列印（明細單 + 工作單，含兩次切紙）。");
        }, 1500);
      } catch (printError) {
        console.error(printError);
        if (checkoutPrintBtn) checkoutPrintBtn.disabled = false;
        if (checkoutBtn) checkoutBtn.disabled = false;
        alert(
          "訂單已轉為店内正式單，但列印失敗：" +
            (printError && printError.message ? printError.message : String(printError))
        );
      }
    }

    let hasBoundStaticUiEvents = false;

    function runAsync(handler) {
      return (...args) => {
        Promise.resolve(handler(...args)).catch((error) => {
          console.error(error);
          alert("操作失敗：" + (error && error.message ? error.message : String(error)));
        });
      };
    }

    function bindStaticUiEventsOnce() {
      if (hasBoundStaticUiEvents) return;
      hasBoundStaticUiEvents = true;

      cartList.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (target.classList.contains("delete-btn")) {
          const index = Number(target.dataset.index);
          if (Number.isFinite(index)) removeCartItem(index);
        }
      });

      clearOrderBtn.addEventListener("click", clearOrder);
      if (printReceiptLink) {
        printReceiptLink.addEventListener("click", (event) => {
          if (event && typeof event.preventDefault === "function") event.preventDefault();
          const href = pendingPassPrntUrl || (printReceiptLink.getAttribute("href") || "");
          if (!href || href === "#") {
            alert("尚未產生列印內容，請先完成結帳。");
            return false;
          }
          window.location.href = href;
          return false;
        });
      }

      const logoutBtn = document.getElementById("logoutBtn");
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          void signOut(auth).catch((error) => {
            console.error(error);
            alert("登出失敗：" + (error && error.message ? error.message : String(error)));
          });
        });
      }

      checkoutBtn.addEventListener("click", checkoutOnly);
      checkoutPrintBtn.addEventListener("click", handleCheckoutAndPrint);
      if (enablePickupTimeCheckbox) {
        enablePickupTimeCheckbox.addEventListener("change", syncPickupTimeVisibility);
      }
      openInventoryBtn.addEventListener("click", openInventoryModal);
      openMonthlyRankingBtn.addEventListener("click", runAsync(openMonthlyRankingModal));
      openReportBtn.addEventListener("click", runAsync(openReportModal));
      openMonthlyReportBtn.addEventListener("click", runAsync(openMonthlyReportModal));
      openHistoryBtn.addEventListener("click", runAsync(openHistoryModal));
      exportDataBtn.addEventListener("click", exportSystemData);
      importDataBtn.addEventListener("click", () => importDataInput.click());
      closeReportBtn.addEventListener("click", closeReportModal);
      resetReportBtn.addEventListener("click", runAsync(resetDailyReport));
      closeMonthlyReportBtn.addEventListener("click", closeMonthlyReportModal);
      clearMonthlyReportBtn.addEventListener("click", runAsync(clearMonthlyReport));
      closeMonthlyRankingBtn.addEventListener("click", closeMonthlyRankingModal);
      closeHistoryBtn.addEventListener("click", closeHistoryModal);
      closeInventoryBtn.addEventListener("click", closeInventoryModal);
      addInventoryItemBtn.addEventListener("click", addInventoryItem);
      inventoryCostInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addInventoryItem();
      });
      historyTabActive.addEventListener("click", runAsync(() => switchHistoryTab("active")));
      historyTabVoided.addEventListener("click", runAsync(() => switchHistoryTab("voided")));

      if (storeAcceptingOrdersToggle) {
        storeAcceptingOrdersToggle.addEventListener("change", () => {
          const v = !!storeAcceptingOrdersToggle.checked;
          updateStoreAcceptingOrdersUi(v);
          persistStoreAcceptingOrders(v).catch((error) => {
            console.error(error);
            alert("更新接單狀態失敗：" + (error && error.message ? error.message : String(error)));
            const revert = !v;
            updateStoreAcceptingOrdersUi(revert);
            storeAcceptingOrdersToggle.checked = revert;
          });
        });
      }

      if (cloudPendingList) {
        cloudPendingList.addEventListener("click", (event) => {
          const t = event.target;
          if (!(t instanceof HTMLElement)) return;
          if (!t.classList.contains("cloud-accept-btn")) return;
          const id = t.getAttribute("data-order-id");
          if (!id) return;
          const targetOrder = cloudPendingOrdersSnapshots.find((o) => o.id === id);
          if (targetOrder) void acceptCloudMobilePendingOrder(targetOrder);
        });
      }

      importDataInput.addEventListener("change", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLInputElement) || !target.files || target.files.length === 0) return;
        const file = target.files[0];
        const reader = new FileReader();
        reader.onload = () => {
          if (typeof reader.result === "string") {
            applyImportedData(reader.result);
          } else {
            alert("匯入失敗：無法讀取檔案內容。");
          }
          target.value = "";
        };
        reader.onerror = () => {
          alert("匯入失敗：讀取檔案時發生錯誤。");
          target.value = "";
        };
        reader.readAsText(file);
      });

      historyList.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;

        if (target.classList.contains("history-detail-btn")) {
          const idx = Number(target.dataset.index);
          if (!Number.isFinite(idx)) return;
          const detail = document.getElementById("historyDetail-" + idx);
          if (detail) {
            const orderId = target.dataset.orderId || detail.dataset.orderId || "";
            const shouldShow = !detail.classList.contains("show");
            detail.classList.toggle("show", shouldShow);
            expandedHistoryOrderId = shouldShow && orderId ? orderId : null;
          }
        }

        if (target.classList.contains("history-void-btn")) {
          const idx = Number(target.dataset.index);
          if (Number.isFinite(idx)) {
            voidOrderByIndex(idx).catch((error) => {
              console.error(error);
              alert("作廢失敗：" + (error && error.message ? error.message : String(error)));
            });
          }
        }

        if (target.classList.contains("history-remove-item-btn")) {
          const idx = Number(target.dataset.index);
          const itemId = target.dataset.itemId;
          const itemName = target.dataset.itemName || "品項";
          if (Number.isFinite(idx) && itemId) {
            removeOneItemFromOrder(idx, itemId, itemName).catch((error) => {
              console.error(error);
              alert("更新失敗：" + (error && error.message ? error.message : String(error)));
            });
          }
        }
      });

      reportModal.addEventListener("click", (event) => {
        if (event.target === reportModal) closeReportModal();
      });

      monthlyReportModal.addEventListener("click", (event) => {
        if (event.target === monthlyReportModal) closeMonthlyReportModal();
      });

      monthlyRankingModal.addEventListener("click", (event) => {
        if (event.target === monthlyRankingModal) closeMonthlyRankingModal();
      });

      historyModal.addEventListener("click", (event) => {
        if (event.target === historyModal) closeHistoryModal();
      });

      inventoryModal.addEventListener("click", (event) => {
        if (event.target === inventoryModal) closeInventoryModal();
      });

      inventoryList.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const itemId = target.dataset.id;
        if (!itemId) return;
        if (target.dataset.action === "plus") adjustInventoryStock(itemId, true);
        if (target.dataset.action === "minus") adjustInventoryStock(itemId, false);
      });

    }

    function bootstrapPosApplication() {
      bindStaticUiEventsOnce();
      buildPickupTimeSelectOptions();
      renderMenu();
      renderCart();
      resetOrderMetaFields();
    }

    const SAVED_EMAIL_KEY = "savedEmail";

    const loginOverlayEl = document.getElementById("loginOverlay");
    const posWorkspaceEl = document.getElementById("posWorkspace");
    const loginErrorTextEl = document.getElementById("loginErrorText");
    const loginEmailEl = document.getElementById("loginEmail");
    const loginPasswordEl = document.getElementById("loginPassword");
    const loginBtnEl = document.getElementById("loginBtn");
    const rememberEmailCheckboxEl = document.getElementById("rememberEmailCheckbox");

    function setLoginError(message) {
      if (loginErrorTextEl) {
        loginErrorTextEl.textContent = message ? String(message) : "";
      }
    }

    function syncLoginFormFromSavedEmail() {
      try {
        const saved = localStorage.getItem(SAVED_EMAIL_KEY);
        if (saved && typeof saved === "string" && saved.trim()) {
          if (loginEmailEl) loginEmailEl.value = saved.trim();
          if (rememberEmailCheckboxEl) rememberEmailCheckboxEl.checked = true;
        } else {
          if (loginEmailEl) loginEmailEl.value = "";
          if (rememberEmailCheckboxEl) rememberEmailCheckboxEl.checked = false;
        }
      } catch (error) {
        if (loginEmailEl) loginEmailEl.value = "";
        if (rememberEmailCheckboxEl) rememberEmailCheckboxEl.checked = false;
      }
    }

    function performLogin() {
      const email = loginEmailEl ? loginEmailEl.value.trim() : "";
      const password = loginPasswordEl ? loginPasswordEl.value : "";
      setLoginError("");
      if (!email) {
        setLoginError("請輸入 Email。");
        return Promise.resolve();
      }
      return signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          if (loginPasswordEl) loginPasswordEl.value = "";
          try {
            if (rememberEmailCheckboxEl && rememberEmailCheckboxEl.checked) {
              localStorage.setItem(SAVED_EMAIL_KEY, email);
            } else {
              localStorage.removeItem(SAVED_EMAIL_KEY);
            }
          } catch (storageError) {
            console.warn(storageError);
          }
        })
        .catch((error) => {
          setLoginError(error.message || String(error));
        });
    }

    if (loginBtnEl) {
      loginBtnEl.addEventListener("click", () => {
        void performLogin();
      });
    }

    if (loginPasswordEl) {
      loginPasswordEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          void performLogin();
        }
      });
    }

    syncLoginFormFromSavedEmail();

    onAuthStateChanged(auth, (user) => {
      if (!loginOverlayEl || !posWorkspaceEl) return;
      if (user) {
        setLoginError("");
        loginOverlayEl.classList.add("is-hidden");
        posWorkspaceEl.hidden = false;
        ensureProductsSeededIfEmpty().catch((err) => {
          console.warn("自動建立 products 菜單略過或失敗（請確認已部署 Firestore 規則並允許已登入者寫入 products）：", err);
        });
        ensureStoreStatusDocExists().catch((err) => {
          console.warn("接單狀態文件略過或失敗：", err);
        });
        startStoreStatusListener();
        startCloudPendingOrdersListener();
      } else {
        stopCloudPendingOrdersListener();
        stopStoreStatusListener();
        posWorkspaceEl.hidden = true;
        loginOverlayEl.classList.remove("is-hidden");
        if (loginPasswordEl) loginPasswordEl.value = "";
        syncLoginFormFromSavedEmail();
      }
    });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootstrapPosApplication, { once: true });
    } else {
      bootstrapPosApplication();
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch((error) => {
          console.warn("Service Worker 註冊失敗：", error);
        });
      });
    }
  </script>
</body>
